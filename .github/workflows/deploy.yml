# 검증 → 이미지(jib → GHCR) → 서버 롤링 배포(SSH, 제한된 배포 키) → 헬스체크. 실패 시 rollout undo.
name: deploy
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:

permissions: { contents: read, packages: write }

env:
  IMAGE: ghcr.io/${{ github.repository }}
  APP: flashgate
  HOST_URL: https://flash.travelzero.kr

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: ./gradlew ktlintCheck test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: test-report, path: build/reports/tests }

  build-push:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs: { tag: '${{ steps.meta.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - id: meta
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - run: ./gradlew jib --image="$IMAGE:${{ steps.meta.outputs.tag }}" -Djib.to.auth.username=${{ github.actor }} -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }} --no-daemon

  deploy:
    needs: build-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: rollout on k3s (SSH forced-command key → scripts/remote-deploy.sh)
        env: { SSH_KEY: '${{ secrets.DEPLOY_SSH_KEY }}', SSH_HOST: '${{ vars.DEPLOY_HOST }}' }
        run: |
          mkdir -p ~/.ssh && echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy deploy@"$SSH_HOST" "$APP $IMAGE:${{ needs.build-push.outputs.tag }}"
      - run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$HOST_URL/actuator/health" | grep -q '"UP"'
